[package]
name = "lofi-studio"
version = "0.7.0"
description = "A modular procedural Lo-Fi mini-studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lofi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tauri-plugin-fs = "2"

# A second launch focuses the running app (it may be playing hidden in the tray) instead of starting another.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows' media controls (keyboard media keys, headphone buttons); the same version Tauri already builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }

# Small and lean: the app is a thin shell around the webview.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
