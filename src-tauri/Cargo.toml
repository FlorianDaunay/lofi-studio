[package]
name = "lofi-studio"
version = "0.4.0"
description = "A modular procedural Lo-Fi mini-studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lofi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

# Small and lean: the app is a thin shell around the webview.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
