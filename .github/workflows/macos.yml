name: macOS app

# Builds Lofi Studio for macOS: one universal app (Apple silicon and Intel) in a .dmg. It is the
# same app as on Windows: the menu-bar icon with its player menu, the mini player, playing on with
# the window closed, and the keyboard and headphone media keys.
# - On a version tag (v*): attaches the .dmg to that tag's GitHub release, created as a draft.
# - Manually (Actions > macOS app > Run workflow): the .dmg is available as a build artifact.
#
# Signing (optional): with the repository secrets APPLE_CERTIFICATE (base64 of a "Developer ID
# Application" .p12), APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY the app is signed; add
# APPLE_ID, APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID and it is notarized too, so
# it opens without a warning. Without them it is ad-hoc signed: it runs, but macOS asks to confirm
# the first launch (System Settings > Privacy & Security > Open Anyway).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run typecheck && npm test

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A missing secret arrives as an empty variable, which Tauri would take as a value: drop those.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            npx tauri build --target universal-apple-darwin --bundles app,dmg
          else
            echo "::warning::No signing secrets: the app is ad-hoc signed, macOS asks to confirm its first launch."
            npx tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          fi

      - name: Name the disk image
        id: dmg
        run: |
          version="$(node -p "require('./package.json').version")"
          name="lofi-studio-${version}-macos.dmg"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.dmg.outputs.path }}
